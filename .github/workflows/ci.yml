name: CI

# Runs the suite on every push and pull request. Until this existed, the unit
# tests and the integration suites in tests/ had only ever run on a developer
# machine, while release.yml built and shipped artifacts off a tag without
# having compiled a single test.
#
# Style and tests are separate jobs on purpose: a formatting slip should not
# hide a test failure behind an early exit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  style:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      # The round-trip corpus stays off the runner. It lives in a private repo,
      # so fetching it would mean a long-lived credential for a public repo's
      # workflow, and the two tests that need it -- round_trip_corpus and the
      # denylist half of corpus_hygiene -- run on the machine that has the
      # corpus anyway. That leaves CI covering the unit tests, both emitter
      # suites, and the corpus-independent hygiene scanners, which is the part
      # a push can break without anybody noticing.
      - name: Test
        env:
          PAXC_ALLOW_MISSING_CORPUS: "1"
        run: cargo test
