# Values ship reads. Format and keys: anderix/ship, docs/DESIGN.md.
targets=apt crates homebrew winget
apt_package=paxc
# No commands: paxc is one package installing two binaries, and a formula is
# written per package, so excelano/homebrew-tap carries paxc.rb alone.
crates=paxc
winget=Excelano.paxc:paxc-x86_64-pc-windows-msvc.zip
